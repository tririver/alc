[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alc-render"
version = "2.0.6"
description = "Atomic overlay contracts and standalone document rendering for ALC."
readme = "README.md"
license = "MIT"
authors = [{ name = "ALC" }]
requires-python = ">=3.11"
dependencies = [
  "ac-document>=2.0.5,<3",
  "Pillow>=10.1,<13",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/tririver/alc"
Repository = "https://github.com/tririver/alc"
Issues = "https://github.com/tririver/alc/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
alc-render = "alc_render.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alc_render"]
