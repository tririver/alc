[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alc-ocr-proofread"
version = "2.0.2"
description = "Durable PDF-vision proofreading of page-mapped OCR for ALC."
readme = "README.md"
license = "MIT"
authors = [{ name = "ALC" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "ac-jobs>=2,<3",
  "ac-llm>=2.0.1,<3",
  "ac-document>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
alc-ocr-proofread = "alc_ocr_proofread.cli:main"

[project.urls]
Homepage = "https://github.com/tririver/alc"
Repository = "https://github.com/tririver/alc"
Issues = "https://github.com/tririver/alc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/alc_ocr_proofread"]
